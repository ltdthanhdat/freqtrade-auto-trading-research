services:
  freqtrade-demo:
    image: freqtradeorg/freqtrade:develop
    working_dir: /workspace
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PYTHONPATH: /workspace
      FREQTRADE__EXCHANGE__KEY: ${FREQTRADE_DEMO_KEY:-}
      FREQTRADE__EXCHANGE__SECRET: ${FREQTRADE_DEMO_SECRET:-}
      FREQTRADE__TELEGRAM__ENABLED: ${FREQTRADE_DEMO_TELEGRAM_ENABLED:-false}
      FREQTRADE__TELEGRAM__TOKEN: ${FREQTRADE_DEMO_TELEGRAM_TOKEN:-}
      FREQTRADE__TELEGRAM__CHAT_ID: ${FREQTRADE_DEMO_TELEGRAM_CHAT_ID:-}
      FREQTRADE__DB_URL: sqlite:////workspace/user_data/tradesv3.demo.sqlite
    volumes:
      - ./:/workspace
    command:
      - trade
      - --config
      - /workspace/config/config.futures.json
      - --config
      - /workspace/config/config.binance.demo.json
      - --strategy
      - SMC_FVG_Context30m_Freqtrade
      - --strategy-path
      - /workspace/src/strategies
      - --logfile
      - /workspace/user_data/logs/freqtrade-demo.log

  freqtrade-live:
    image: freqtradeorg/freqtrade:develop
    working_dir: /workspace
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PYTHONPATH: /workspace
      FREQTRADE__EXCHANGE__KEY: ${FREQTRADE_LIVE_KEY:-}
      FREQTRADE__EXCHANGE__SECRET: ${FREQTRADE_LIVE_SECRET:-}
      FREQTRADE__TELEGRAM__ENABLED: ${FREQTRADE_LIVE_TELEGRAM_ENABLED:-false}
      FREQTRADE__TELEGRAM__TOKEN: ${FREQTRADE_LIVE_TELEGRAM_TOKEN:-}
      FREQTRADE__TELEGRAM__CHAT_ID: ${FREQTRADE_LIVE_TELEGRAM_CHAT_ID:-}
      FREQTRADE__DB_URL: sqlite:////workspace/user_data/tradesv3.live.sqlite
    volumes:
      - ./:/workspace
    command:
      - trade
      - --config
      - /workspace/config/config.futures.json
      - --config
      - /workspace/config/config.binance.live.json
      - --strategy
      - SMC_FVG_Context30m_Freqtrade
      - --strategy-path
      - /workspace/src/strategies
      - --logfile
      - /workspace/user_data/logs/freqtrade-live.log

  research:
    build:
      context: .
      dockerfile: Dockerfile.research
    profiles: ["research"]
    working_dir: ${RESEARCH_ROOT:-/workspace}
    read_only: true
    stdin_open: false
    tty: false
    network_mode: bridge
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      CODEX_HOME: /home/ftuser/.codex
      PI_AGENT_SOURCE_DIR: /pi/agent-source
      PI_WEB_SEARCH_CONFIG_SOURCE: /pi/web-search.json
      PI_CODING_AGENT_DIR: /tmp/pi-agent
      PI_WEB_ACCESS_EXTENSION: /opt/pi-extensions/node_modules/pi-web-access/index.ts
      PYTHONPATH: ${RESEARCH_ROOT:-/workspace}
      UV_NO_SYNC: "1"
      UV_PROJECT_ENVIRONMENT: /opt/research-venv
      RESEARCH_ROOT: ${RESEARCH_ROOT:-/workspace}
      RESEARCH_DATASET: ${RESEARCH_DATASET:-snapshots/fresh_outer_oos_2026q3}
      RESEARCH_TIMERANGE: ${RESEARCH_TIMERANGE:-20260124-20260914}
      RESEARCH_RUN_KEY: ${RESEARCH_RUN_KEY:-local-research}
      RESEARCH_SNAPSHOT_MANIFEST: ${RESEARCH_ROOT:-/workspace}/user_data/research-artifacts/runs/${RESEARCH_RUN_KEY:-local-research}/snapshot-readiness.json
      RESEARCH_MODEL: ${RESEARCH_MODEL:-openai-codex/gpt-5.6-luna}
      MAX_CYCLES: ${MAX_CYCLES:-1}
      RESEARCH_TIMEOUT: ${RESEARCH_TIMEOUT:-2400}
    tmpfs:
      - ${RESEARCH_ROOT:-/workspace}/user_data:rw,uid=1000,gid=1000,mode=0700
      - /tmp:rw,mode=1777
      - /home/ftuser/.cache:rw,uid=1000,gid=1000,mode=0700
    volumes:
      - ./:${RESEARCH_ROOT:-/workspace}:ro
      - ./user_data/research.sqlite:${RESEARCH_ROOT:-/workspace}/user_data/research.sqlite
      - ./user_data/research-artifacts:${RESEARCH_ROOT:-/workspace}/user_data/research-artifacts
      - ${RESEARCH_SNAPSHOT_ROOT:-./user_data/data/snapshots}:${RESEARCH_ROOT:-/workspace}/user_data/data/snapshots:ro
      - ${CODEX_HOME:-${HOME}/.codex}:/home/ftuser/.codex:ro
      - ${PI_AGENT_DIR:-${HOME}/.pi/agent}:/pi/agent-source:ro
      - ${PI_WEB_SEARCH_CONFIG:-${HOME}/.pi/web-search.json}:/pi/web-search.json:ro
    entrypoint: ["/usr/local/bin/research-entrypoint"]
    command:
      - --db
      - ${RESEARCH_ROOT:-/workspace}/user_data/research.sqlite
      - --dataset
      - ${RESEARCH_DATASET:-snapshots/fresh_outer_oos_2026q3}
      - --run-key
      - ${RESEARCH_RUN_KEY:-local-research}
      - --artifacts
      - ${RESEARCH_ROOT:-/workspace}/user_data/research-artifacts
      - --snapshot-manifest
      - ${RESEARCH_ROOT:-/workspace}/user_data/research-artifacts/runs/${RESEARCH_RUN_KEY:-local-research}/snapshot-readiness.json
      - --timerange
      - ${RESEARCH_TIMERANGE:-20260124-20260914}
      - --max-cycles
      - ${MAX_CYCLES:-1}
      - --cycle-timeout
      - ${RESEARCH_TIMEOUT:-2400}

  research-data-prep:
    build:
      context: .
      dockerfile: Dockerfile.research
    profiles: ["research"]
    working_dir: /workspace
    read_only: true
    stdin_open: false
    tty: false
    network_mode: bridge
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PYTHONPATH: /workspace
      UV_NO_SYNC: "1"
      UV_PROJECT_ENVIRONMENT: /opt/research-venv
      RESEARCH_RUN_KEY: ${RESEARCH_RUN_KEY:-local-research}
      RESEARCH_DATASET: ${RESEARCH_DATASET:-snapshots/fresh_outer_oos_2026q3}
      RESEARCH_TIMERANGE: ${RESEARCH_TIMERANGE:-20260124-20260914}
    tmpfs:
      - /tmp:rw,mode=1777
      - /home/ftuser/.cache:rw,uid=1000,gid=1000,mode=0700
    volumes:
      - ./:/workspace:ro
      - ${RESEARCH_SNAPSHOT_WORK_ROOT:-./user_data/data}:/workspace/user_data/data:rw
      - ${RESEARCH_ARTIFACT_ROOT:-./user_data/research-artifacts}:/workspace/user_data/research-artifacts:rw
    entrypoint: ["/opt/research-venv/bin/python"]
    command:
      - -m
      - scripts.prepare_research_data
      - --config
      - /workspace/config/config.futures.json
      - --policy
      - /workspace/config/validation.baseline.json
      - --data-root
      - /workspace/user_data/data
      - --staging-root
      - /workspace/user_data/data/.staging/${RESEARCH_RUN_KEY:-local-research}
      - --dataset
      - ${RESEARCH_DATASET:-snapshots/fresh_outer_oos_2026q3}
      - --snapshot-id
      - ${RESEARCH_DATASET:-snapshots/fresh_outer_oos_2026q3}
      - --timeframes
      - 30m
      - 1h
      - 1m
      - --manifest
      - /workspace/user_data/research-artifacts/runs/${RESEARCH_RUN_KEY:-local-research}/snapshot-readiness.json
      - --run-key
      - ${RESEARCH_RUN_KEY:-local-research}
      - --summary-root
      - /workspace/user_data/research-artifacts
      - --timerange
      - ${RESEARCH_TIMERANGE:-20260124-20260914}
